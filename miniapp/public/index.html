<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reels Library</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Telegram Mini App</p>
        <h1>Библиотека роликов</h1>
      </div>
      <div class="stats" id="stats"></div>
    </header>

    <section class="filters">
      <input id="search" class="search" type="search" placeholder="Поиск по названию, тексту или заметке">
      <div class="chips" id="chips">
        <button class="chip active" data-filter="all">Все</button>
        <button class="chip" data-filter="edited">📹 Смонтированы</button>
        <button class="chip" data-filter="not_edited">Без монтажа</button>
        <button class="chip" data-filter="posted">✅ Выложены</button>
        <button class="chip" data-filter="not_posted">Не выложены</button>
      </div>
    </section>

    <main class="layout">
      <section class="library-panel">
        <div class="panel-head">
          <h2>Список</h2>
          <span id="result-count" class="muted"></span>
        </div>
        <div id="video-list" class="video-list"></div>
      </section>

      <section class="detail-panel">
        <div id="detail-empty" class="empty-state">
          Выбери ролик слева. Здесь будут статусы, текст суфлёра, заметка и ссылки на файлы.
        </div>
        <div id="detail" class="detail hidden"></div>
      </section>
    </main>
  </div>

  <template id="video-card-template">
    <button class="video-card">
      <div class="video-card-top">
        <div>
          <div class="video-card-title"></div>
          <div class="video-card-meta"></div>
        </div>
        <div class="badges"></div>
      </div>
      <div class="video-card-status"></div>
    </button>
  </template>

  <script src="/app.js"></script>
</body>
</html>
